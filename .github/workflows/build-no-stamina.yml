name: Build Valhalla Combat No-Stamina

on:
  workflow_dispatch:
  push:
    branches:
      - valhalla-no-stamina-1.3.3

jobs:
  build:
    name: Build DLL
    runs-on: windows-2022

    steps:
      - name: Checkout Valhalla Combat
        uses: actions/checkout@v4

      - name: Checkout CommonLibSSE-NG
        uses: actions/checkout@v4
        with:
          repository: CharmedBaryon/CommonLibSSE-NG
          ref: d51fa0938bf53f829ff83a144079136f0d4a2f18
          path: CommonLibSSE-NG
          submodules: recursive

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 44b540607036e0587f6564c91f93663b0212ab98
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore legacy 7-Zip dependency
        shell: pwsh
        run: |
          $downloads = "${{ github.workspace }}\vcpkg\downloads"
          New-Item -ItemType Directory -Force -Path "$downloads" | Out-Null

          $dest = "$downloads\7z2107-extra.7z"

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            -o "$dest" `
            "https://downloads.sourceforge.net/project/sevenzip/7-Zip/21.07/7z2107-extra.7z"

          $expected = "648d894940bcc29951752d7a8fd18c770ee8d4fd944e17f1a52588e51ca8f58375ba48514538f2e1387786fd812bb86f75fd6bdd0892685cdcafb2989942c848"
          $actual = (Get-FileHash "$dest" -Algorithm SHA512).Hash.ToLower()

          if ($actual -ne $expected) {
            throw "7-Zip SHA512 mismatch. Expected $expected but got $actual"
          }

          Write-Host "Legacy 7-Zip archive verified successfully."

      - name: Disable obsolete pkg-config checks
        shell: pwsh
        run: |
          $ports = @(
            "${{ github.workspace }}\vcpkg\ports\fmt\portfile.cmake",
            "${{ github.workspace }}\vcpkg\ports\spdlog\portfile.cmake"
          )

          foreach ($file in $ports) {
            $text = Get-Content "$file" -Raw

            if (-not $text.Contains("vcpkg_fixup_pkgconfig()")) {
              throw "Expected vcpkg_fixup_pkgconfig() not found in $file"
            }

            $text = $text.Replace(
              "vcpkg_fixup_pkgconfig()",
              "vcpkg_fixup_pkgconfig(SKIP_CHECK)"
            )

            Set-Content -Path "$file" -Value $text -NoNewline
            Write-Host "Patched pkg-config validation: $file"
          }

      - name: Prepare compiled output directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ github.workspace }}\compiled\SKSE\Plugins" |
            Out-Null

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          CommonLibSSEPath_NG: ${{ github.workspace }}\CommonLibSSE-NG
          CompiledPluginsPath: ${{ github.workspace }}\compiled
        run: cmake --preset vs2022-windows -Wno-error=deprecated

      - name: Build Release DLL
        shell: pwsh
        run: cmake --build build --config Release --target ValhallaCombat --parallel

      - name: Verify output
        shell: pwsh
        run: |
          Write-Host "=== COMPILED PLUGINS ==="
          Get-ChildItem "${{ github.workspace }}\compiled\SKSE\Plugins"

          $dll = Get-ChildItem `
            "${{ github.workspace }}\compiled\SKSE\Plugins" `
            -Filter "*.dll" |
            Select-Object -First 1

          if (-not $dll) {
            throw "Valhalla Combat DLL was not produced."
          }

          Write-Host "DLL: $($dll.FullName)"

      - name: Upload Valhalla Combat DLL
        uses: actions/upload-artifact@v4
        with:
          name: Valhalla-Combat-No-Stamina-1.3.3
          path: |
            compiled/SKSE/Plugins/*.dll
            compiled/SKSE/Plugins/*.pdb
          if-no-files-found: error
